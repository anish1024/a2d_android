<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A2D Cloud</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-card">
        <h1>Welcome to A2D</h1>
        <p>Enter your credentials to continue.</p>

        <form id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="your password" required>
            <button type="submit" id="login-submit">Continue with Email</button>
        </form>

        <div id="login-error" class="error" style="color:red; display:none; margin-top:8px;"></div>
        <div id="login-loading" style="display:none; margin-top:8px;">
            <span>Logging in...</span>
        </div>
        <div id="server-health" class="health" style="margin-top:8px; font-size:0.9em;">
            Server health: <span id="server-health-status">checking...</span>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-submit');
        const errorDiv = document.getElementById('login-error');
        const loadingDiv = document.getElementById('login-loading');
        const healthSpan = document.getElementById('server-health-status');

        async function checkServerHealth() {
            try {
                const resp = await fetch('/healthz');
                const data = await resp.json();
                healthSpan.textContent = data.status === 'ok' ? 'online' : 'offline';
            } catch (e) {
                healthSpan.textContent = 'offline';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            if (!email || !password) return;

            loginBtn.disabled = true;
            errorDiv.style.display = 'none';
            loadingDiv.style.display = 'block';

            try {
                const response = await fetch('/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ email, password })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || `Login failed (${response.status})`);
                }

                const data = await response.json();
                localStorage.setItem('a2d_token', data.access_token);
                window.location.href = '/dashboard';
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        });

        document.addEventListener('DOMContentLoaded', checkServerHealth);
    </script>
</body>
</html>
