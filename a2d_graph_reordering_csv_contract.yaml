      type:
        type: boolean
    - name: context
      type:
        type: string
    - name: creationTime
      type:
        type: optional
        of:
          type: string
    - name: activities
      type:
        type: list
        items:
          type: action_item
    - name: progressPercent
      type:
        type: integer
      notes: 'Computed property: 0 when activities.isEmpty(), otherwise count achieved * 100 / activities.size using
        integer division.'
  contract_version: 0.0.0
  dependencies:
  - node: activity_processor
  - node: activity_achieved
  - node: action_item
  implements:
  - node: activity_processor
  calls: []
  data_flows: []
  stub_behavior: ''
  tests:
  - id: task_domain_no_callback
    description: No callback marks a task achieved.
    given: Task.processActivity() with no callback.
    expect: achieved becomes true.
  - id: task_domain_callback
    description: A callback can evaluate the task activities.
    given: Task.processActivity(callback) with an activity-evaluating callback.
    expect: achieved reflects the callback result.
  - id: task_is_completed_empty
    description: Empty task is not completed by the redesign completion rule.
    given: Task with no activities.
    expect: isCompleted is false.
  - id: task_is_completed_partial
    description: Task with an unchecked activity is not completed.
    given: Task with at least one activity and at least one unchecked activity.
    expect: isCompleted is false.
  - id: task_is_completed_all
    description: Task with all activities achieved is completed.
    given: Task with at least one activity and all activities achieved.
    expect: isCompleted is true.
  - id: task_progress_empty
    description: Empty task has zero progress.
    given: Task with no activities.
    expect: progressPercent is 0.
  - id: task_progress_partial
    description: Partial completion reports integer percentage.
    given: Task with 1 of 4 activities achieved.
    expect: progressPercent is 25.
  - id: task_progress_truncated
    description: Progress uses integer division.
    given: Task with 2 of 3 activities achieved.
    expect: progressPercent is 66.
  - id: task_progress_all
    description: All achieved activities report full progress.
    given: Task with all activities achieved.
    expect: progressPercent is 100.
  notes: 'Data class implementing ActivityAchieved and ActivityProcessor. Redesign01 adds isCompleted = activities.isNotEmpty()
    && activities.all { it.achieved }. Redesign02 adds progressPercent = 0 for no activities, otherwise achieved-count
    * 100 / activity-count with integer division. Gate achieved behavior remains distinct: Tier-1 treats an empty
    task as achieved, while isCompleted requires at least one activity. Activities are kept in ID order by the repository.'
  prompt_template: ''
  prompt: ''
