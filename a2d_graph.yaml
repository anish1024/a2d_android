- id: process_pulse
  title: ''
  status: implemented
  boundary: null
  parent: logic_gates
  interface:
    protocol: function
    layout: function
    params:
    - name: input_pin
      type:
        type: string
    - name: pulse
      type:
        type: string
    returns:
      type: pulse_result
    errors:
    - code: ValueError
      description: pulse is not HIGH/LOW after strip+upper, or input_pin is not an integer string
    preconditions:
    - input_pin parses as an integer (it is the AND-gate arity)
    postconditions:
    - LOW clears the pin's latched inputs, sets output 0 and reset true
    - HIGH appends 1 to the pin's inputs; output is 1 once len(inputs) >= int(input_pin), else 0
  contract_version: 0.0.0
  dependencies: []
  calls: []
  data_flows: []
  stub_behavior: ''
  tests: []
  notes: Normalize pulse with strip().upper(). Return a pulse_result; on HIGH return a copy of the latched
    inputs list.
  prompt_template: ''
  prompt: ''
