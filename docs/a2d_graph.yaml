    layout: file
    fields: []
  contract_version: 0.0.0
  dependencies: []
  implements: []
  calls: []
  data_flows: []
  stub_behavior: ''
  tests:
  - id: gate_high_latching
    description: HIGH pulses latch until arity is met.
    given: HIGH pulses on a pin whose arity has not yet been reached.
    expect: output remains 0 until the arity is met, then becomes 1.
  - id: gate_low_reset
    description: LOW resets the pin register.
    given: LOW pulse.
    expect: reset is true and the register is cleared.
  - id: gate_invalid_pulse
    description: Invalid pulse input is rejected.
    given: A pulse other than HIGH or LOW.
    expect_raises: IllegalArgumentException
  - id: gate_non_integer_pin
    description: Non-integer pin input is rejected.
    given: A non-integer input pin.
    expect_raises: IllegalArgumentException
  notes: Singleton in-memory pin register. Arity is parsed from inputPin. Pulse is normalized with trim().uppercase(). HIGH
    latches 1 until size >= arity; LOW clears the register and returns reset=true. Thread safety uses @Synchronized and ConcurrentHashMap<String,
    PinState>. Constructor-injected with @Inject.
  prompt_template: ''
  prompt: ''
